name: Build Astro
description: Install dependencies with npm cache, build the Astro static site, and upload the dist artifact - new.

inputs:
  node-version:
    description: Node.js version (e.g. `22.23`) to use for the build.
    required: false
    default: '22.23'
  artifact-name:
    description: Name to give the uploaded build artifact.
    required: false
    default: dist
  run-tests:
    description: Whether to run the vitest test suite after installing.
    required: false
    default: 'true'

runs:
  using: composite  #means this will run where its called, not here
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install
      run: npm ci
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Test
      if: ${{ inputs.run-tests == 'true' }}
      run: npm test
      shell: bash

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/